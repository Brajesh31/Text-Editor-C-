name: Feature request
description: Propose a specific improvement to the editor.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the README and roadmap first. Explain the user problem rather than only naming a feature.
  - type: textarea
    id: problem
    attributes:
      label: Problem or user need
      description: What limitation are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the expected user experience and command syntax, if relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches could solve the same problem?
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: Compatibility, safety, and testing impact
      description: Consider buffer limits, history, memory safety, terminal behavior, and tests.
    validations:
      required: true
